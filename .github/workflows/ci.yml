name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag to publish or repair
        required: true
        type: string

jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          xcrun --sdk macosx --show-sdk-version
      - name: Cache SwiftPM dependencies
        if: github.event_name != 'workflow_dispatch' && !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        uses: actions/cache@v4
        with:
          path: .codex-runtime/swiftpm-cache
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode-27-${{ hashFiles('App/Package.resolved', 'App/Package.swift', 'Packages/**/Package.swift') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode-27-
      - name: Build
        if: github.event_name != 'workflow_dispatch' && !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        run: ./script/ci.sh
      - name: Validate release sources
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        run: ./script/ci.sh checks

  release:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: xcode-27
    concurrency:
      group: sparkle-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Restore SwiftPM dependencies
        uses: actions/cache/restore@v4
        with:
          path: .codex-runtime/swiftpm-cache
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode-27-${{ hashFiles('App/Package.resolved', 'App/Package.swift', 'Packages/**/Package.swift') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode-27-
      - name: Check out current release-control files
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v6
        with:
          path: release-control
          ref: ${{ github.sha }}
      - name: Validate release tag and pre-made copy
        run: |
          release_tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          if ! git rev-parse --verify --quiet "refs/tags/$release_tag" >/dev/null; then
            echo "Release tag $release_tag does not exist." >&2
            exit 1
          fi
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH (for example, v0.1.0)." >&2
            exit 1
          fi
          version="${release_tag#v}"
          release_control_root="$GITHUB_WORKSPACE"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            release_control_root="$GITHUB_WORKSPACE/release-control"
          fi
          release_copy="$release_control_root/Releases/$release_tag.json"
          if [[ ! -f "$release_copy" ]]; then
            echo "Releases/$release_tag.json must be written, reviewed, and committed before publishing." >&2
            exit 1
          fi
          "$release_control_root/script/validate_release_tag.sh" \
            "$release_control_root" "$release_tag"
          echo "SAKURACORD_VERSION=$version" >> "$GITHUB_ENV"
          echo "SAKURACORD_BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "SAKURACORD_RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "SAKURACORD_RELEASE_CONTROL_ROOT=$release_control_root" >> "$GITHUB_ENV"
          echo "SAKURACORD_RELEASE_COPY=$release_copy" >> "$GITHUB_ENV"
          echo "SAKURACORD_DMG_PATH=dist/SakuraCord.v$version.dmg" >> "$GITHUB_ENV"
      - name: Prepare exact release notes and Discord copy
        run: |
          mkdir -p dist
          node "$SAKURACORD_RELEASE_CONTROL_ROOT/script/release_automation.mjs" prepare \
            --input "$SAKURACORD_RELEASE_COPY" \
            --tag "$SAKURACORD_RELEASE_TAG" \
            --output dist/release-copy.json \
            --notes-output dist/release-notes.md
      - name: Inspect existing release checkpoints
        id: existing_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          published=false
          announced=false
          if gh release view "$SAKURACORD_RELEASE_TAG" >/dev/null 2>&1; then
            is_draft="$(gh release view "$SAKURACORD_RELEASE_TAG" --json isDraft --jq .isDraft)"
            if [[ "$is_draft" == "false" ]]; then
              published=true
            fi
            checkpoint_dir="$RUNNER_TEMP/release-checkpoints"
            mkdir -p "$checkpoint_dir"
            if gh release download "$SAKURACORD_RELEASE_TAG" \
              --pattern discord-announcement.json --dir "$checkpoint_dir" >/dev/null 2>&1; then
              announced=true
            fi
          fi
          echo "published=$published" >> "$GITHUB_OUTPUT"
          echo "announced=$announced" >> "$GITHUB_OUTPUT"
      - name: Validate Sparkle release secrets
        if: steps.existing_release.outputs.published != 'true'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          SPARKLE_ED_PUBLIC_KEY: ${{ secrets.SPARKLE_ED_PUBLIC_KEY }}
          SPARKLE_ADHOC_RELEASE_ACK: ${{ secrets.SPARKLE_ADHOC_RELEASE_ACK }}
        run: |
          if [[ -z "$SPARKLE_ED_PRIVATE_KEY" || -z "$SPARKLE_ED_PUBLIC_KEY" ]]; then
            echo "SPARKLE_ED_PRIVATE_KEY and SPARKLE_ED_PUBLIC_KEY must be configured." >&2
            exit 1
          fi
          private_key_bytes="$(printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | base64 -D | wc -c | tr -d '[:space:]')"
          public_key_bytes="$(printf '%s' "$SPARKLE_ED_PUBLIC_KEY" | base64 -D | wc -c | tr -d '[:space:]')"
          if [[ "$private_key_bytes" != "32" || "$public_key_bytes" != "32" ]]; then
            echo "Sparkle secrets must contain base64-encoded 32-byte Ed25519 keys." >&2
            exit 1
          fi
          if [[ "$SPARKLE_ADHOC_RELEASE_ACK" != "ad-hoc-updates-are-not-notarized" ]]; then
            echo "Set SPARKLE_ADHOC_RELEASE_ACK only after reviewing the documented distribution limitation." >&2
            exit 1
          fi
      - name: Install DMG tooling
        if: steps.existing_release.outputs.published != 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install "dmgbuild==1.6.7"
          echo "DMGBUILD=$RUNNER_TEMP/dmgbuild/bin/dmgbuild" >> "$GITHUB_ENV"
      - name: Package DMG
        if: steps.existing_release.outputs.published != 'true'
        env:
          SAKURACORD_ENABLE_UPDATES: 1
          SPARKLE_ED_PUBLIC_KEY: ${{ secrets.SPARKLE_ED_PUBLIC_KEY }}
        run: ./script/package_dmg.sh
      - name: Generate and validate signed Sparkle appcast
        if: steps.existing_release.outputs.published != 'true'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          SPARKLE_ED_PUBLIC_KEY: ${{ secrets.SPARKLE_ED_PUBLIC_KEY }}
        run: |
          ./script/generate_appcast.sh \
            "$SAKURACORD_DMG_PATH" dist/appcast.xml dist/release-notes.md
      - name: Publish or repair GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ steps.existing_release.outputs.published }}" == "true" ]]; then
            gh release edit "$SAKURACORD_RELEASE_TAG" --notes-file dist/release-notes.md
            gh release upload "$SAKURACORD_RELEASE_TAG" dist/release-copy.json --clobber
          elif gh release view "$SAKURACORD_RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$SAKURACORD_RELEASE_TAG" --notes-file dist/release-notes.md
            gh release upload "$SAKURACORD_RELEASE_TAG" \
              "$SAKURACORD_DMG_PATH" dist/appcast.xml dist/release-copy.json --clobber
            gh release edit "$SAKURACORD_RELEASE_TAG" --draft=false
          else
            gh release create "$SAKURACORD_RELEASE_TAG" \
              "$SAKURACORD_DMG_PATH" dist/appcast.xml dist/release-copy.json \
              --draft \
              --title "SakuraCord $SAKURACORD_RELEASE_TAG" \
              --verify-tag \
              --notes-file dist/release-notes.md
            gh release edit "$SAKURACORD_RELEASE_TAG" --draft=false
          fi
      - name: Verify published release assets
        if: steps.existing_release.outputs.published != 'true'
        run: |
          published_appcast="$RUNNER_TEMP/published-appcast.xml"
          published_dmg="$RUNNER_TEMP/published.dmg"
          release_prefix="https://github.com/$GITHUB_REPOSITORY/releases/download/$SAKURACORD_RELEASE_TAG"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
            --output "$published_appcast" "$release_prefix/appcast.xml"
          cmp dist/appcast.xml "$published_appcast"
          enclosure_url="$(
            xmllint --xpath \
              'string((//*[local-name()="enclosure"])[1]/@url)' \
              "$published_appcast"
          )"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
            --output "$published_dmg" "$enclosure_url"
          cmp "$SAKURACORD_DMG_PATH" "$published_dmg"
      - name: Resolve the published release
        id: published_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_json="$(gh release view "$SAKURACORD_RELEASE_TAG" --json databaseId,isDraft,url)"
          if [[ "$(jq -r .isDraft <<< "$release_json")" != "false" ]]; then
            echo "The GitHub Release is still a draft." >&2
            exit 1
          fi
          echo "id=$(jq -r .databaseId <<< "$release_json")" >> "$GITHUB_OUTPUT"
          echo "url=$(jq -r .url <<< "$release_json")" >> "$GITHUB_OUTPUT"
      - name: Send the pre-made Discord release announcement
        if: steps.existing_release.outputs.announced != 'true'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_RELEASE_CHANNEL_ID: ${{ secrets.DISCORD_RELEASE_CHANNEL_ID }}
          DISCORD_UPDATES_ROLE_ID: ${{ secrets.DISCORD_UPDATES_ROLE_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          message_id="$(node "$SAKURACORD_RELEASE_CONTROL_ROOT/script/release_automation.mjs" announce-discord \
            --input dist/release-copy.json \
            --repo "$GITHUB_REPOSITORY" \
            --release-id "${{ steps.published_release.outputs.id }}" \
            --release-url "${{ steps.published_release.outputs.url }}" \
            | sed -n 's/^Discord release announcement checkpoint: //p')"
          if [[ ! "$message_id" =~ ^[0-9]{17,20}$ ]]; then
            echo "Discord did not return a valid announcement checkpoint." >&2
            exit 1
          fi
          jq -n \
            --arg tag "$SAKURACORD_RELEASE_TAG" \
            --arg messageId "$message_id" \
            '{schemaVersion: 1, tagName: $tag, messageId: $messageId}' \
            > dist/discord-announcement.json
          gh release upload "$SAKURACORD_RELEASE_TAG" \
            dist/discord-announcement.json --clobber
