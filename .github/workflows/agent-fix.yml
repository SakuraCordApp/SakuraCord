name: Agent · Fix
run-name: >-
  ${{ github.event.label.name == 'agent: fix' && format('Agent · Fix · #{0}', github.event.issue.number) || 'Agent · Skipped' }}

# The separate implementation stage of the SakuraCord issue pipeline. Only people with write access (or the
# hub, on a maintainer's request from Discord) can add `agent: fix`. Claude works
# offline in the checkout, and a draft pull request is opened for human review.
# Nothing is ever merged automatically.

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: agent-fix-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  fix:
    if: "github.event.label.name == 'agent: fix'"
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      BRANCH: agent/issue-${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: nightly
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .agent-control
          sparse-checkout: .github/agents
          persist-credentials: false
      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Cache SwiftPM dependencies
        uses: actions/cache@v6
        with:
          path: .codex-runtime/swiftpm-cache
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode-27-${{ hashFiles('App/Package.resolved', 'App/Package.swift', 'Packages/**/Package.swift') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode-27-
      - name: Resolve dependencies and tools before going offline
        run: |
          source script/runtime.sh
          swift package --package-path "$SAKURACORD_PACKAGE_DIR" \
            --cache-path "$SAKURACORD_SWIFTPM_CACHE_DIR" \
            --scratch-path "$SAKURACORD_SCRATCH_DIR" resolve
          # script/test.sh builds each package in its own scratch directory.
          for package in Packages/*/; do
            swift package --package-path "$package" \
              --cache-path "$SAKURACORD_SWIFTPM_CACHE_DIR" \
              --scratch-path "$package.build" resolve
          done
          ./script/code_quality.sh check || true
      - name: Build prompt
        run: |
          node .agent-control/.github/agents/issue-context.mjs .agent-control/.github/agents/fix.md "$RUNNER_TEMP/prompt.md"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.316
      # SwiftPM cannot start its own sandbox inside the agent's sandbox.
      - name: Add sandbox-compatible swift
        run: |
          mkdir -p "$RUNNER_TEMP/agent-bin"
          cat > "$RUNNER_TEMP/agent-bin/swift" <<'EOF'
          #!/bin/bash
          case "$1" in
            build|test|run|package) sub="$1"; shift; exec /usr/bin/swift "$sub" --disable-sandbox "$@" ;;
            *) exec /usr/bin/swift "$@" ;;
          esac
          EOF
          chmod +x "$RUNNER_TEMP/agent-bin/swift"
      # Shell commands run sandboxed with no network and can write only the working tree
      # and Darwin's per-user temp and cache folders, which Swift Build saves through.
      # Git metadata stays read-only so later steps restore automation from the real HEAD.
      # Trust-service access lets Swift Build verify signed binary xcframeworks.
      - name: Fix with Claude
        env:
          GH_TOKEN: ""
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: ${{ vars.AGENT_FIX_MODEL || 'claude-sonnet-5-5' }}
          EFFORT: ${{ vars.AGENT_FIX_EFFORT || 'high' }}
        run: |
          settings=$(jq -n --arg git "$GITHUB_WORKSPACE/.git" --arg temp "$(getconf DARWIN_USER_TEMP_DIR)" --arg cache "$(getconf DARWIN_USER_CACHE_DIR)" '{sandbox: {
            enabled: true, failIfUnavailable: true, allowUnsandboxedCommands: false, enableWeakerNetworkIsolation: true,
            network: {allowedDomains: []}, filesystem: {allowWrite: [$temp, $cache], denyWrite: [$git]},
            credentials: {envVars: [{name: "ANTHROPIC_API_KEY", mode: "deny"}]}}}')
          PATH="$RUNNER_TEMP/agent-bin:$PATH" claude -p --model "$MODEL" --effort "$EFFORT" --max-budget-usd 20 \
            --output-format json --no-session-persistence --strict-mcp-config \
            --tools "Bash,Read,Edit,Write,Grep,Glob" --allowedTools Bash Read "Edit(/**)" "Write(/**)" Grep Glob \
            --disallowedTools "Edit(/.git/**)" "Write(/.git/**)" \
            --permission-mode dontAsk --settings "$settings" \
            --json-schema "$(cat .agent-control/.github/agents/fix.schema.json)" \
            < "$RUNNER_TEMP/prompt.md" > "$RUNNER_TEMP/claude.json"
          jq -r '"Claude cost: $\(.total_cost_usd)"' "$RUNNER_TEMP/claude.json" >> "$GITHUB_STEP_SUMMARY"
          jq -e '.structured_output' "$RUNNER_TEMP/claude.json" > "$RUNNER_TEMP/fix.json"
      - name: Check changes
        id: changes
        run: |
          rm -rf .agent-control
          git restore --staged . 2>/dev/null || true
          # Never ship agent edits to automation, release, or signing files.
          git restore --source=HEAD --staged --worktree -- .github .githooks script Config Releases
          git clean -fd -- .github .githooks script Config Releases
          if git status --porcelain | grep -q .; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
      - name: Code quality
        if: steps.changes.outputs.changed == 'true'
        id: quality
        continue-on-error: true
        run: |
          files=$(git diff --name-only -- '*.swift'; git ls-files --others --exclude-standard -- '*.swift')
          if [ -n "$files" ]; then ./script/code_quality.sh fix --files $files || true; fi
          ./script/code_quality.sh check
      - name: Create app token
        if: steps.changes.outputs.changed == 'true'
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SAKURACORD_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SAKURACORD_BOT_PRIVATE_KEY }}
      - name: Open draft pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          RESULT_PATH: ${{ runner.temp }}/fix.json
          QUALITY: ${{ steps.quality.outcome }}
        run: |
          bot_id=$(GH_TOKEN="$APP_TOKEN" gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          title=$(jq -r '.title' "$RESULT_PATH")
          git switch -C "$BRANCH"
          git add -A
          git commit -m "$title" -m "Fixes #$ISSUE_NUMBER"
          git push --force "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
          {
            echo "Fixes #$ISSUE_NUMBER"
            echo
            echo "### Summary"
            jq -r '.summary' "$RESULT_PATH"
            echo
            echo "### Verification"
            jq -r '.verification' "$RESULT_PATH"
            echo
            echo "### Review notes"
            jq -r '.risks' "$RESULT_PATH"
            echo
            if [ "$QUALITY" != "success" ]; then echo "> ⚠️ \`./script/code_quality.sh check\` still reports problems."; echo; fi
            echo "<sub>🤖 Drafted by the fix agent ([run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})). Review carefully before marking ready.</sub>"
          } > pr.md
          existing=$(GH_TOKEN="$APP_TOKEN" gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            GH_TOKEN="$APP_TOKEN" gh pr edit "$existing" --title "$title" --body-file pr.md
          else
            GH_TOKEN="$APP_TOKEN" gh pr create --draft --base nightly --head "$BRANCH" --title "$title" --body-file pr.md
          fi
      - name: Report no change
        if: steps.changes.outputs.changed != 'true'
        env:
          RESULT_PATH: ${{ runner.temp }}/fix.json
        run: |
          {
            echo "<!-- sakuracord:agent -->"
            echo "<!-- sakuracord:agent-run fix ${GITHUB_RUN_ID} ${GITHUB_RUN_ATTEMPT} -->"
            echo "### Summary"
            echo "🤖 The fix agent didn't make a change for this issue."
            echo
            jq -r '.summary // "No explanation was produced."' "$RESULT_PATH" 2>/dev/null || true
          } > note.md
          gh issue comment "$ISSUE_NUMBER" --body-file note.md
      - name: Clear trigger label
        if: always()
        run: |
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent: fix" || true
