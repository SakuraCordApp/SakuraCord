name: Sync Main Into Nightly

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-main-into-nightly
  cancel-in-progress: false

jobs:
  sync:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: nightly
      - name: Merge main into nightly
        run: ./script/sync_main_into_nightly.sh
