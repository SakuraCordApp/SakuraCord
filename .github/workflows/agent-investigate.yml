name: Agent · Triage and investigate
run-name: >-
  ${{ github.event.label.name == 'agent: investigate' && format('Agent · Triage · #{0}', github.event.issue.number) || 'Agent · Skipped' }}

# One read-only agent assesses every new report using the nightly codebase.
# The hub applies the result and removes the trigger label after success.
# A failed run keeps the label so it can be retried from Actions.

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: agent-investigate-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  investigate:
    if: "github.event.label.name == 'agent: investigate'"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      AGENT_MODEL: ${{ vars.AGENT_INVESTIGATE_MODEL || 'claude-sonnet-5-5' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: nightly
          fetch-depth: 0
          persist-credentials: false
      - name: Record source commit
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      # The default-branch copy of the agent files is trusted; nightly may differ.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .agent-control
          sparse-checkout: .github/agents
          persist-credentials: false
      - name: Build prompt
        run: node .agent-control/.github/agents/issue-context.mjs .agent-control/.github/agents/investigate.md "$RUNNER_TEMP/prompt.md" --triage
      # Ubuntu's bubblewrap AppArmor profile and user-namespace restriction stop the
      # sandbox from starting, which would leave the agent without a shell.
      - name: Install Claude Code
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap socat
          sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          npm install -g @anthropic-ai/claude-code@2.1.316
      # Sandboxed commands can read other processes' environments here, so the key
      # stays out of every environment and is read only by Claude Code itself.
      - name: Store the API key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -m 700 ~/.agent-secrets
          printf '%s' "$ANTHROPIC_API_KEY" > ~/.agent-secrets/anthropic-key
      # Shell commands run sandboxed with no network and cannot write the checkout or
      # runner files, so the trusted post step and later step environment stay intact.
      # A leading `//` marks an absolute path in permission rules.
      - name: Investigate with Claude
        env:
          GH_TOKEN: ""
          EFFORT: ${{ vars.AGENT_INVESTIGATE_EFFORT || 'high' }}
        run: |
          secrets="$HOME/.agent-secrets"
          settings=$(jq -n --arg workspace "$GITHUB_WORKSPACE" --arg temp "$RUNNER_TEMP" --arg secrets "$secrets" '{
            apiKeyHelper: "cat \($secrets)/anthropic-key", sandbox: {
            enabled: true, failIfUnavailable: true, allowUnsandboxedCommands: false,
            network: {allowedDomains: []}, filesystem: {denyWrite: [$workspace, $temp], denyRead: [$secrets]}}}')
          claude -p --model "$AGENT_MODEL" --effort "$EFFORT" --max-budget-usd 5 \
            --output-format json --no-session-persistence --strict-mcp-config \
            --tools "Bash,Read,Grep,Glob" --allowedTools Bash Read Grep Glob \
            --disallowedTools "Read(/$secrets/**)" \
            --permission-mode dontAsk --add-dir "$RUNNER_TEMP" --settings "$settings" \
            --json-schema "$(cat .agent-control/.github/agents/investigation.schema.json)" \
            < "$RUNNER_TEMP/prompt.md" > "$RUNNER_TEMP/claude.json"
          jq -r '"Claude cost: $\(.total_cost_usd)"' "$RUNNER_TEMP/claude.json" >> "$GITHUB_STEP_SUMMARY"
          jq -e '.structured_output' "$RUNNER_TEMP/claude.json" > "$RUNNER_TEMP/investigation.json"
      - name: Post findings
        env:
          RESULT_PATH: ${{ runner.temp }}/investigation.json
        run: node .agent-control/.github/agents/post-investigation.mjs
