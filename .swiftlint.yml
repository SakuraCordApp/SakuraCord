included:
  - App/Sources
  - Packages
excluded:
  - "**/.build"
disabled_rules:
  - opening_brace
  - trailing_comma
line_length:
  warning: 200
  error: 260
type_body_length:
  warning: 1200
  error: 3000
file_length:
  warning: 2000
  error: 5000
function_body_length:
  warning: 100
  error: 250
cyclomatic_complexity:
  warning: 15
  error: 30
function_parameter_count:
  warning: 7
  error: 9
nesting:
  type_level: 2
  function_level: 3
identifier_name:
  min_length: 2
